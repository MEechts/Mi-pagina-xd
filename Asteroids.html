<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids </title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.as.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: 'Press Start 2P', cursive;
        }

        canvas {
            border: 2px solid white;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: 2px solid white;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            background-color: #777;
        }

        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-family: 'Press Start 2P', cursive;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            display: none;
        }

        #restartText {
            font-size: 20px; /* Tamaño más pequeño para el texto de reinicio */
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info">
        Puntaje: <span id="score">0</span>
    </div>
    <button id="pauseButton">Pausar</button>
    <div id="gameOverScreen">
        GAME OVER
        <div id="restartText">Presiona ENTER para reiniciar</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pauseButton = document.getElementById('pauseButton');
        const gameOverScreen = document.getElementById('gameOverScreen');

        // Propiedades de la nave
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: 0,
            speed: 0,
            rotationSpeed: 0.05,
            thrust: 0.2,
            maxSpeed: 4,
            width: 30,
            height: 30,
            dx: 0,
            dy: 0
        };

        const asteroids = [];
        const bullets = [];
        let score = 0;

        let isThrusting = false;
        let isShooting = false;
        let lastShootTime = 0;
        const shootCooldown = 300;  // 0.30 segundos de cooldown

        let isPaused = false;  // Estado de pausa
        let gameOver = false;  // Estado de "Game Over"

        // Generar asteroides de manera aleatoria fuera de la vista
        function createAsteroids() {
            if (isPaused || gameOver) return;  // No crear asteroides si el juego está pausado o terminado
            const size = Math.random() * 50 + 20;
            
            let asteroid = {};
            const edge = Math.floor(Math.random() * 4);

            if (edge === 0) {
                asteroid.x = Math.random() * canvas.width;
                asteroid.y = -size;
            } else if (edge === 1) {
                asteroid.x = canvas.width + size;
                asteroid.y = Math.random() * canvas.height;
            } else if (edge === 2) {
                asteroid.x = Math.random() * canvas.width;
                asteroid.y = canvas.height + size;
            } else {
                asteroid.x = -size;
                asteroid.y = Math.random() * canvas.height;
            }

            asteroid.size = size;
            asteroid.dx = Math.random() * 3 - 1.5;
            asteroid.dy = Math.random() * 3 - 1.5;

            asteroids.push(asteroid);
        }

        // Dibujar la nave espacial
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(player.width / 2, player.height / 2);
            ctx.lineTo(-player.width / 2, player.height / 2);
            ctx.closePath();
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();
        }

        // Mover la nave espacial
        function movePlayer() {
            if (isThrusting) {
                player.dx += Math.cos(player.angle) * player.thrust;
                player.dy += Math.sin(player.angle) * player.thrust;
            }

            const speed = Math.sqrt(player.dx * player.dx + player.dy * player.dy);
            if (speed > player.maxSpeed) {
                const angle = Math.atan2(player.dy, player.dx);
                player.dx = Math.cos(angle) * player.maxSpeed;
                player.dy = Math.sin(angle) * player.maxSpeed;
            }

            player.x += player.dx;
            player.y += player.dy;

            if (player.x > canvas.width) player.x = 0;
            if (player.x < 0) player.x = canvas.width;
            if (player.y > canvas.height) player.y = 0;
            if (player.y < 0) player.y = canvas.height;
        }

        // Dibujar los asteroides
        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.beginPath();
                ctx.arc(asteroid.x, asteroid.y, asteroid.size, 0, Math.PI * 2);
                ctx.fillStyle = 'gray';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();
            });
        }

        // Mover los asteroides
        function moveAsteroids() {
            asteroids.forEach(asteroid => {
                asteroid.x += asteroid.dx;
                asteroid.y += asteroid.dy;

                if (asteroid.x > canvas.width) asteroid.x = 0;
                if (asteroid.x < 0) asteroid.x = canvas.width;
                if (asteroid.y > canvas.height) asteroid.y = 0;
                if (asteroid.y < 0) asteroid.y = canvas.height;
            });
        }

        // Disparar balas
        function shootBullet() {
            if (isPaused || gameOver) return;
            const currentTime = Date.now();
            if (currentTime - lastShootTime >= shootCooldown) {
                const bullet = {
                    x: player.x + Math.cos(player.angle) * player.width / 2,
                    y: player.y + Math.sin(player.angle) * player.width / 2,
                    dx: Math.cos(player.angle) * 5,
                    dy: Math.sin(player.angle) * 5,
                    radius: 5
                };
                bullets.push(bullet);
                lastShootTime = currentTime;
            }
        }

        // Dibujar las balas
        function drawBullets() {
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
            });
        }

        // Mover las balas
        function moveBullets() {
            bullets.forEach(bullet => {
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
            });
        }

        // Detectar colisiones entre balas y asteroides
        function detectBulletCollisions() {
            for (let i = 0; i < bullets.length; i++) {
                for (let j = 0; j < asteroids.length; j++) {
                    const dist = Math.sqrt(Math.pow(bullets[i].x - asteroids[j].x, 2) + Math.pow(bullets[i].y - asteroids[j].y, 2));
                    if (dist < asteroids[j].size + bullets[i].radius) {
                        // Dividir asteroide en dos
                        if (asteroids[j].size > 20) {
                            const newSize = asteroids[j].size / 2;
                            asteroids.push({
                                x: asteroids[j].x,
                                y: asteroids[j].y,
                                size: newSize,
                                dx: asteroids[j].dx + Math.random() * 2 - 1,
                                dy: asteroids[j].dy + Math.random() * 2 - 1
                            });
                            asteroids.push({
                                x: asteroids[j].x,
                                y: asteroids[j].y,
                                size: newSize,
                                dx: asteroids[j].dx + Math.random() * 2 - 1,
                                dy: asteroids[j].dy + Math.random() * 2 - 1
                            });
                        }
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        i--;
                        score += 10;  // Aumentar puntaje por destruir un asteroide
                        break;
                    }
                }
            }
        }

        // Detectar colisiones entre la nave y los asteroides
        function detectPlayerCollisions() {
            for (let i = 0; i < asteroids.length; i++) {
                const dist = Math.sqrt(Math.pow(player.x - asteroids[i].x, 2) + Math.pow(player.y - asteroids[i].y, 2));
                if (dist < player.width / 2 + asteroids[i].size / 2) {
                    gameOver = true;  // Marcar el fin del juego
                    gameOverScreen.style.display = "block";  // Mostrar el mensaje de "Game Over"
                    return;
                }
            }
        }

        // Manejar los controles del teclado
        function handleKeys() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') isThrusting = true;
                if (e.key === ' ' || e.key === 'Enter') isShooting = true;
                if (e.key === 'Enter' && gameOver) resetGame();  // Reiniciar el juego al presionar ENTER
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') isThrusting = false;
                if (e.key === ' ' || e.key === 'Enter') isShooting = false;
            });
        }

        // Controlar la rotación y la dirección de la nave con el ratón
        function controlMouse(e) {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            player.angle = Math.atan2(dy, dx);

            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 5) {
                player.dx += Math.cos(player.angle) * player.thrust;
                player.dy += Math.sin(player.angle) * player.thrust;
            }
        }

        // Función principal de actualización del juego
        function gameLoop() {
            if (isPaused || gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            movePlayer();
            if (isShooting) shootBullet();
            moveAsteroids();
            moveBullets();

            detectBulletCollisions();
            detectPlayerCollisions();

            drawPlayer();
            drawAsteroids();
            drawBullets();

            // Mostrar el puntaje
            document.getElementById("score").textContent = score;

            requestAnimationFrame(gameLoop);
        }

        // Crear asteroides cada 2 segundos
        setInterval(createAsteroids, 2000);

        // Inicializar el juego
        function init() {
            handleKeys();
            canvas.addEventListener('mousemove', controlMouse);
            gameLoop();
        }

        // Función de pausa/reanudación
        function togglePause() {
            isPaused = !isPaused;
            if (!isPaused && !gameOver) {
                gameLoop();
            }
            pauseButton.textContent = isPaused ? "Reanudar" : "Pausar";
        }

        // Función para reiniciar el juego
        function resetGame() {
            gameOver = false;
            score = 0;
            asteroids.length = 0;
            bullets.length = 0;
            gameOverScreen.style.display = "none"; // Ocultar el mensaje de Game Over
            init();
        }

        pauseButton.addEventListener('click', togglePause);

        init();
    </script>
</body>
<audio id="starSound">
    <source srs="Song asteroid.mp3" type="audio/mp3">
    tu navegador no es compatible con la Song
</audio>
</html>
