    <style>
 
        body { 
            font-family: 'Press Start 2P', cursive; 
            text-align: center; 
            margin: 0; 
            color: #0f0;
            overflow: hidden;
            background-color: #000;
            background-image: 
                url('https://upload.wikimedia.org/wikipedia/commons/4/45/Space_Invaders_Character_Icon.png'), 
                url('https://upload.wikimedia.org/wikipedia/commons/2/2d/Space_invader_game_piece.png'),
                url('https://upload.wikimedia.org/wikipedia/commons/4/47/Galaga_Logo.png');
            background-size: 100px 100px, 50px 50px, 300px 150px;
            background-repeat: no-repeat;
            background-position: center, bottom left, top center;
            animation: move-background 10s infinite linear;
            
        }
        

        h1 { color: #ff0; }
        p { font-size: 18px; }
        .container { padding: 20px; }
        .game-link { 
            display: block; 
            margin: 10px auto; 
            padding: 10px; 
            background: #222; 
            color: rgba(91, 17, 209, 0.788); 
            text-decoration: none; 
            width: 200px; 
        }

        .game-link:hover { 
            background: #0f0; 
            color: #000; 
        }

        /* Estilo para las estrellas */
        .star {
            position: absolute;
            border-radius: 50%;
            background-color: #fff;
            animation: twinkle 1.5s infinite;
        }

        /* Animación para el parpadeo de las estrellas */
        @keyframes twinkle {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Fondo de estrellas parpadeantes */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* Crear un número aleatorio de estrellas en posiciones aleatorias */
        .star-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star-container .star {
            width: 3px;
            height: 3px;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        /* Generación de estrellas */
        .star-container .star:nth-child(odd) {
            animation-duration: 2s;
        }
        
        .star-container .star:nth-child(even) {
            animation-duration: 1.5s;
        }

        /* Animación de movimiento de fondo */
        @keyframes move-background {
            0% { background-position: center, bottom left, top center; }
            50% { background-position: left center, bottom center, top right; }
            100% { background-position: center, bottom left, top center; }
        }

        /* Estilo para las naves que se moverán de lado a lado */
        .galaga-ships {
            position: absolute;
            top: 10%;
            left: 0;
            width: 100%;
            height: 50px;
            animation: move-ships 8s linear infinite;
        }

        /* Animación para mover las naves de lado a lado */
        @keyframes move-ships {
            0% { transform: translateX(0); }
            50% { transform: translateX(calc(100vw - 200px)); }  /* Llega al borde derecho */
            100% { transform: translateX(0); }  /* Vuelve al borde izquierdo */
        }

        /* Estilo para las naves individuales de Galaga usando una imagen */
        .ship {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/3/34/Galaga_enemies.png'); /* Imagen de los enemigos de Galaga */
            background-size: cover; /* Asegura que la imagen se ajuste correctamente al tamaño del div */
            border-radius: 5px;
        }

        /* Posicionamiento de las naves en una formación */
        .ship:nth-child(1) { top: 0%; left: 5%; }
        .ship:nth-child(2) { top: 10%; left: 20%; }
        .ship:nth-child(3) { top: 0%; left: 40%; }
        .ship:nth-child(4) { top: 10%; left: 60%; }
        .ship:nth-child(5) { top: 0%; left: 80%; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
