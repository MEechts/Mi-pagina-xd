<!DOCTYPE html>
<html lang="es-En">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Retro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icono.ico">
</head>
<body>
    <audio autoplay loop>
        <source src="song2.mp3" type="audio/mpeg">
        Tu navegador no es compatible con la música.
    </audio>

    <!-- Sonido para el botón "Jugar" -->
    <audio id="startSound">
        <source src="start-sound.mp3" type="audio/mpeg">
    </audio>

    <div class="contenedor">
        <h1>Pac-Man Retro</h1>
        <p>¡Prepárate para esta increíble aventura comiendo fantasmas!</p>
        <a href="#" class="boton-start" id="jugarBtn">¡Jugar!</a> 
            
        <a href="http://127.0.0.1:5501/asteriod/menu/MENU.html" class="boton de repagina">Vuelve al inicio</a>
    </div>

    <script>
        document.getElementById("jugarBtn").addEventListener("click", function(event) {
            event.preventDefault(); // Evita que el enlace navegue a otra página
            document.getElementById("startSound").play(); // Reproduce el sonido
        });
    </script>
</body>
</html>
